# Generates the Xcode project, builds the app, runs the unit tests on an iOS 18 iPhone simulator
# and, in a second job at the same time, builds once for a real iPhone. Nothing else: no
# screenshots and no uploads, so the run is as short as it can be. Visual checks are done by hand on an iPhone; the QA and UI tests are in
# full-tests.yml (started by hand).
# Runs on every push to a claude/** branch, so a Claude thread sees the result before it opens or
# announces a pull request, and on pull requests from any other branch. A claude/** branch is not
# built a second time for its pull request: the push run's result shows on the PR anyway.
name: CI

on:
  push:
    # main too, so its build cache is there for every new claude/** branch to start from.
    branches: ['claude/**', main]
    paths:
      - "Fallow/**"
      - "FallowTests/**"
      - "FallowWidgets/**"
      - "Shared/**"
      - "project.yml"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Fallow/**"
      - "FallowTests/**"
      - "FallowWidgets/**"
      - "Shared/**"
      - "project.yml"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # Full history for the file dates below, but without file contents (blob:none): only this
      # commit's files are downloaded, not every old version.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Use the newest Xcode
        # Apple Intelligence (Foundation Models) needs the iOS 26 SDK; TestFlight needs it too.
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      # The build cache: Xcode only recompiles what changed since the last run on this branch (or
      # on main). A checkout gives every file today's date, which would look like a change to all
      # of them, so the dates are set back to each file's last commit first. --no-renames keeps
      # git from downloading old file contents to detect renames.
      - name: Keep file dates from git
        run: |
          python3 - <<'PY'
          import os, subprocess
          out = subprocess.run(["git", "log", "--no-renames", "--name-only", "--format=@%ct"], capture_output=True, text=True, check=True).stdout
          seen, when = set(), 0
          for line in out.splitlines():
              if line.startswith("@"): when = int(line[1:]); continue
              if line and line not in seen and os.path.exists(line):
                  seen.add(line); os.utime(line, (when, when))
          print(f"dates set on {len(seen)} files")
          PY

      # The key includes this file, so a change to the build flags saves a fresh cache.
      - name: Restore the build cache
        uses: actions/cache@v4
        with:
          path: build/DerivedData
          key: dd-${{ runner.os }}-${{ hashFiles('Fallow/**', 'FallowTests/**', 'FallowWidgets/**', 'Shared/**', 'project.yml', '.github/workflows/ci.yml') }}
          restore-keys: dd-${{ runner.os }}-

      # XcodeGen's prebuilt release instead of Homebrew: brew took 7 to 70 seconds, the download
      # takes one.
      - name: Generate the Xcode project
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          touch "$RUNNER_TEMP/before-generate"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --quiet
          # XcodeGen writes the project, plists and schemes anew every run. With today's date they
          # look changed and Xcode redoes the steps that read them, so they get project.yml's
          # date: same project.yml, same files.
          find . \( -path ./build -o -path ./.git \) -prune -o -type f -newer "$RUNNER_TEMP/before-generate" -print \
            | tee "$RUNNER_TEMP/generated.txt" | xargs -I{} touch -r project.yml {}
          echo "generated files dated like project.yml: $(wc -l < "$RUNNER_TEMP/generated.txt")"
          # Folders get a fixed old date too: a checkout dates them today, and Xcode reads a folder
          # like Assets.xcassets as one input, so the asset catalog was compiled again every run.
          find . \( -path ./build -o -path ./.git \) -prune -o -type d -print | xargs -I{} touch -t 202001010000 {}

      # Built for "any simulator" (arm64 only, like the runner), before any simulator is started:
      # while CoreSimulator boots a device, xcodebuild stalls and compiling the asset catalog takes
      # minutes instead of seconds.
      - name: Build the app and the unit tests
        run: |
          mkdir -p build
          xcodebuild build-for-testing \
            -project Fallow.xcodeproj -scheme Fallow \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            -showBuildTimingSummary \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > build/xcodebuild.log 2>&1 || true
          grep -E "error:|warning: .*\.swift|\*\* (TEST |)BUILD" build/xcodebuild.log || true
          # What the build did (a warm run compiles only the changed files) and where the time went.
          grep -oE "^[A-Z][A-Za-z]+ " build/xcodebuild.log | sort | uniq -c | sort -rn | head -12
          sed -n "/Build Timing Summary/,/^\*\*/p" build/xcodebuild.log | head -25
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" build/xcodebuild.log

      - name: Run the unit tests
        run: |
          # iOS 18, the app's minimum version. Starting CoreSimulator and booting the device takes
          # three to four minutes on the runner (an iOS 26 one is slower still), and while it
          # boots every xcodebuild call stalls, so it is started only after the build.
          START=$(date +%s)
          UDID=$(IOS_MAJOR=18 bash scripts/pick-simulator.sh)
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          echo "simulator ready after $(( $(date +%s) - START )) s"
          xcodebuild test-without-building \
            -project Fallow.xcodeproj -scheme Fallow \
            -destination "id=$UDID,arch=arm64" \
            -parallel-testing-enabled NO \
            -derivedDataPath build/DerivedData \
            > build/test.log 2>&1 || true
          grep -E "error:|Test (Case|Suite|run)|✔|✘|\*\* TEST" build/test.log || true
          grep -qE "\*\* TEST (EXECUTE )?SUCCEEDED \*\*" build/test.log

  # Some frameworks (Journaling Suggestions) exist only on devices, not in the Simulator, so the
  # app is also built for a real iPhone. A job of its own, next to the one above: it needs no
  # simulator, and on a public repository the extra runner costs nothing.
  device-build:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # Full history for the file dates below, but without file contents (blob:none): only this
      # commit's files are downloaded, not every old version.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Use the newest Xcode
        # Apple Intelligence (Foundation Models) needs the iOS 26 SDK; TestFlight needs it too.
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      # The build cache: Xcode only recompiles what changed since the last run on this branch (or
      # on main). A checkout gives every file today's date, which would look like a change to all
      # of them, so the dates are set back to each file's last commit first. --no-renames keeps
      # git from downloading old file contents to detect renames.
      - name: Keep file dates from git
        run: |
          python3 - <<'PY'
          import os, subprocess
          out = subprocess.run(["git", "log", "--no-renames", "--name-only", "--format=@%ct"], capture_output=True, text=True, check=True).stdout
          seen, when = set(), 0
          for line in out.splitlines():
              if line.startswith("@"): when = int(line[1:]); continue
              if line and line not in seen and os.path.exists(line):
                  seen.add(line); os.utime(line, (when, when))
          print(f"dates set on {len(seen)} files")
          PY

      # The key includes this file, so a change to the build flags saves a fresh cache.
      - name: Restore the build cache
        uses: actions/cache@v4
        with:
          path: build/DerivedData
          key: dd-device-${{ runner.os }}-${{ hashFiles('Fallow/**', 'FallowTests/**', 'FallowWidgets/**', 'Shared/**', 'project.yml', '.github/workflows/ci.yml') }}
          restore-keys: dd-device-${{ runner.os }}-

      # XcodeGen's prebuilt release instead of Homebrew: brew took 7 to 70 seconds, the download
      # takes one.
      - name: Generate the Xcode project
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          touch "$RUNNER_TEMP/before-generate"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --quiet
          # XcodeGen writes the project, plists and schemes anew every run. With today's date they
          # look changed and Xcode redoes the steps that read them, so they get project.yml's
          # date: same project.yml, same files.
          find . \( -path ./build -o -path ./.git \) -prune -o -type f -newer "$RUNNER_TEMP/before-generate" -print \
            | tee "$RUNNER_TEMP/generated.txt" | xargs -I{} touch -r project.yml {}
          echo "generated files dated like project.yml: $(wc -l < "$RUNNER_TEMP/generated.txt")"
          # Folders get a fixed old date too: a checkout dates them today, and Xcode reads a folder
          # like Assets.xcassets as one input, so the asset catalog was compiled again every run.
          find . \( -path ./build -o -path ./.git \) -prune -o -type d -print | xargs -I{} touch -t 202001010000 {}

      - name: Build for a real iPhone
        run: |
          mkdir -p build
          xcodebuild build \
            -project Fallow.xcodeproj -scheme Fallow \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > build/device.log 2>&1 || true
          grep -E "error:|warning: .*\.swift|\*\* BUILD" build/device.log || true
          sed -n "/Build Timing Summary/,/^\*\*/p" build/device.log | head -12
          grep -q "\*\* BUILD SUCCEEDED \*\*" build/device.log
