name: CI

# macOS minutes count 10x on private repos, so CI runs only on pull requests
# and only when something that affects the build changes.
on:
  pull_request:
    paths:
      - "Fallow/**"
      - "FallowTests/**"
      - "FallowUITests/**"
      - "FallowWidgets/**"
      - "Shared/**"
      - "project.yml"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        # Apple Intelligence (Foundation Models) needs the iOS 26 SDK; TestFlight needs it too.
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test on the simulator
        run: |
          UDID=$(scripts/pick-simulator.sh)
          echo "Simulator: $UDID"
          xcodebuild test \
            -project Fallow.xcodeproj \
            -scheme Fallow \
            -destination "id=$UDID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E '(error|warning: .*Fallow/|Test (Suite|Case)|passed|failed|\*\* )' || true
          grep -q '\*\* TEST SUCCEEDED \*\*' build.log

      - name: Build for a real iPhone
        # Some frameworks (Journaling Suggestions) exist only on devices, not in the Simulator.
        run: |
          xcodebuild build \
            -project Fallow.xcodeproj \
            -scheme Fallow \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            | tee device.log | grep -E '(error|warning: .*Fallow/|\*\* )' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' device.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            device.log
            TestResults.xcresult
