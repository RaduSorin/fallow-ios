name: Fallow
options:
  bundleIdPrefix: app.fallow
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Fallow:
    type: application
    platform: iOS
    sources:
      - Fallow
      - Shared
    dependencies:
      - target: FallowWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fallow.ios
        PRODUCT_NAME: Fallow
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Fallow/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Fallow
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSFaceIDUsageDescription: Fallow uses Face ID to open your private journal.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Fallow can save the length of your guided exercises to Health as mindful minutes. Nothing you write goes to Health.
        INFOPLIST_KEY_NSHealthShareUsageDescription: Fallow does not read anything from Health.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Fallow/Fallow.entitlements
  FallowWidgets:
    type: app-extension
    platform: iOS
    sources:
      - FallowWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fallow.ios.widgets
        PRODUCT_NAME: FallowWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: FallowWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Fallow
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: FallowWidgets/FallowWidgets.entitlements
        SKIP_INSTALL: YES
  FallowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FallowTests
    dependencies:
      - target: Fallow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.fallow.ios.tests
  FallowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FallowUITests
    dependencies:
      - target: Fallow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.fallow.ios.uitests
        TEST_TARGET_NAME: Fallow
schemes:
  Fallow:
    build:
      targets:
        Fallow: all
        FallowTests: [test]
        FallowUITests: [test]
    test:
      targets:
        - FallowTests
        - FallowUITests
